name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:

  simple_deployment_pipeline:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - uses: actions/setup-node@v4
        with:
            node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Check style 
        run : npm run eslint 
      - name: Build check
        run : npm run build 
      - name: Test check
        run: npm run test
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Start application
        run: npm start &
      - name: Wait for server to be ready
        run: npx wait-on http://localhost:8080
      - name: Run Playwright tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30   
      - name: Render Deployment
      # only deploy on push and merge not on pull
        if: ${{ github.event_name == 'push' }}
        run: curl https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_API_KEY }}
      
      - name: Set up context
        run: |
          echo "JOB_NAME=${{ github.workflow }}" >> $GITHUB_ENV
          echo "COMMIT_HASH=${{ github.sha }}" >> $GITHUB_ENV
          echo "COMMIT_AUTHOR=${{ github.actor }}" >> $GITHUB_ENV

      - name: Test Success
        uses: rjstone/discord-webhook-notify@v1
        if: success()
        with:
          severity: info
          details: |
            Job: ${{ env.JOB_NAME }}
            Commit: ${{ env.COMMIT_HASH }}
            Author: ${{ env.COMMIT_AUTHOR }}
            Status: Test Succeeded!
          webhookUrl: "https://discord.com/api/webhooks/1258806904440754176/B45UKZleTK5b5d7DSS7SGqM67M312kr6cbgvpOVB9eOmHh2v2SzcULu0vKvDl0q_DMlq"

      - name: Test Failure
        uses: rjstone/discord-webhook-notify@v1
        if: failure()
        with:
          severity: error
          details: |
            Job: ${{ env.JOB_NAME }}
            Commit: ${{ env.COMMIT_HASH }}
            Author: ${{ env.COMMIT_AUTHOR }}
            Status: Test Failed!
          webhookUrl: "https://discord.com/api/webhooks/1258806904440754176/B45UKZleTK5b5d7DSS7SGqM67M312kr6cbgvpOVB9eOmHh2v2SzcULu0vKvDl0q_DMlq"

      - name: Test Cancelled
        uses: rjstone/discord-webhook-notify@v1
        if: cancelled()
        with:
          severity: warn
          details: |
            Job: ${{ env.JOB_NAME }}
            Commit: ${{ env.COMMIT_HASH }}
            Author: ${{ env.COMMIT_AUTHOR }}
            Status: Test Cancelled!
          webhookUrl: "https://discord.com/api/webhooks/1258806904440754176/B45UKZleTK5b5d7DSS7SGqM67M312kr6cbgvpOVB9eOmHh2v2SzcULu0vKvDl0q_DMlq"

  tag_release:
       needs: [simple_deployment_pipeline]
       runs-on: ubuntu-20.04 
       steps:
        - uses: actions/checkout@v4
          with:
              ref: ${{ github.event.pull_request.merge_commit_sha }}
              fetch-depth: '0'
        - name: Checkout
          uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: '20'        
        - name: Configure Git user
          run: |
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
    
        - name: Get commit messages
          id: get_commit_messages
          run: |
            COMMIT_MESSAGES=$(echo '${{ toJson(github.event.commits.*.message) }}' | jq -r '. | join(" ")')
            echo "COMMIT_MESSAGES=$COMMIT_MESSAGES" >> $GITHUB_ENV
      
        - name: Print commit messages
          run: echo "$COMMIT_MESSAGES"
      
        - name: Skip tag found
          if: contains(env.COMMIT_MESSAGES, '#skip')
          run: echo "Skipping version bump"
      
        - name: Bump version and push tag
          uses: phish108/autotag-action@v1.1.55
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            BUMP: patch    #default 
            DRY_RUN: true
            with-v: true  
 
  